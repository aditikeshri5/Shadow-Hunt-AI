
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Hunt AI</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <p class="eyebrow">ARTIFICIAL INTELLIGENCE PROJECT</p>
        <h1>SHADOW <span>HUNT AI</span></h1>
        <p class="subtitle">
            Collect the crystals. Escape the maze. Outsmart the Hunters.
        </p>

        <section class="game-panel">
            <div class="game-heading">
                <h2>MISSION: MAZE ESCAPE</h2>
                <span id="connection">CONNECTING...</span>
            </div>

            <div class="difficulty-controls">
                <span>DIFFICULTY</span>
                <button class="difficulty-btn" data-level="easy">EASY</button>
                <button class="difficulty-btn active" data-level="medium">MEDIUM</button>
                <button class="difficulty-btn" data-level="hard">HARD</button>
            </div>

            <div class="game-info">
                <span>LEVEL: <strong id="difficultyLabel">MEDIUM</strong></span>
                <span>HUNTERS: <strong id="hunterCount">1</strong></span>
            </div>

            <div id="maze" aria-label="Game maze"></div>

            <div class="stats">
                <p>CRYSTALS: <strong id="score">0/5</strong></p>
                <p>HUNTER AGGRESSION: <strong id="aggression">25%</strong></p>
                <p id="status">Loading game...</p>
            </div>
        </section>

        <p class="instructions">
            Move: WASD or Arrow Keys · Restart: R
        </p>

        <div class="action-buttons">
            <button id="newMaze">NEW MAZE</button>
            <button id="restart">RESTART MISSION</button>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
